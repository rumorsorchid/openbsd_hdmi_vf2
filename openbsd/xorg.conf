# /etc/X11/xorg.conf for the VisionFive 2 with the HDMIFB kernel.
# Stock wsfb driver: the framebuffer is uncached, so nothing needs syncing.
Section "Device"
	Identifier	"VisionFive2-HDMI"
	Driver		"wsfb"
	Option		"Device" "/dev/ttyC0"
	Option		"ShadowFB" "true"
EndSection

Section "Screen"
	Identifier	"VisionFive2-Screen"
	Device		"VisionFive2-HDMI"
EndSection
